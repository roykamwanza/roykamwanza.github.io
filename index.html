<style>
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:#F5F3ED}
a{color:#202522;text-decoration:none}a:hover{color:#287A59}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #287A59;outline-offset:3px;border-radius:6px}
.rk-dark a:focus-visible{outline-color:#8FD3B2}
.rk-nav{display:flex}
.rk-menu-btn{display:none}
@media (max-width: 760px){.rk-nav{display:none}.rk-menu-btn{display:inline-flex}}
.rk-card{transition:transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease}
.rk-card{will-change:transform}
.rk-card:hover{transform:translateY(-3px);box-shadow:0 22px 44px -30px rgba(32,37,34,.45);border-color:#CFC9BB}
@media (max-width: 760px){.rk-term-hero{left:0 !important;width:100% !important}.rk-stage{padding-bottom:130px !important}}
.rk-fx-on .rk-fx{opacity:1}
.rk-pre .rk-stag{opacity:0}
.rk-seen .rk-stag{animation:rk-up2 700ms cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i, 0) * 90ms)}
@keyframes rk-wordA{0%{opacity:0;translate:0 .45em;filter:blur(6px)}100%{opacity:1;translate:0 0;filter:blur(0)}}
@keyframes rk-wordB{0%{opacity:0;translate:0 .45em;filter:blur(6px)}100%{opacity:1;translate:0 0;filter:blur(0)}}
@keyframes rk-underA{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
@keyframes rk-underB{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
@keyframes rk-livedot{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
@keyframes rk-up2{from{opacity:0;translate:0 24px;filter:blur(5px)}to{opacity:1;translate:0 0;filter:blur(0)}}
.rk-avatar{transition:filter 450ms ease}
.rk-stage:hover .rk-avatar{filter:drop-shadow(0 34px 44px rgba(32,37,34,.42)) !important}
.rk-tab{transition:color 200ms ease, background-color 200ms ease}
.rk-tab:hover{color:#F5F3ED}
.rk-acc{display:grid;transition:grid-template-rows 420ms cubic-bezier(.2,.7,.2,1), opacity 300ms ease}
.rk-acc > div{overflow:hidden;min-height:0}
.rk-chev{transition:transform 300ms ease}
.rk-range{width:100%;accent-color:#287A59;height:28px;cursor:pointer}
.rk-ul:hover{color:#287A59}
.rk-row:hover{color:#287A59}
.rk-media{position:relative;overflow:hidden}
.rk-img{transition:transform 400ms cubic-bezier(.2,.7,.2,1)}
.rk-card:hover .rk-img{transform:scale(1.03)}
.rk-fx{position:absolute;inset:0;opacity:0;transition:opacity 250ms ease;pointer-events:none}
.rk-card:hover .rk-fx,.rk-card:focus-within .rk-fx{opacity:1}
@media (hover: none){.rk-fx{opacity:1}}
.rk-draw{stroke-dasharray:60;stroke-dashoffset:60;animation:rk-draw 2.6s ease-in-out infinite}
@keyframes rk-draw{0%{stroke-dashoffset:60}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
.rk-dot{animation:rk-pulse 1.3s ease-in-out infinite}
@keyframes rk-pulse{0%,100%{opacity:.55}50%{opacity:1}}
.rk-card:hover .rk-film-img{animation:rk-scrub 2.4s linear infinite}
@keyframes rk-scrub{0%{transform:scale(1.14) translateX(5%)}100%{transform:scale(1.14) translateX(-5%)}}
.rk-term-input{background:transparent;border:0;outline:none;color:#F5F3ED;font:inherit;caret-color:#8FD3B2;flex:1;min-width:0;padding:0}
.rk-term-input:focus-visible{outline:none}
.rk-term:focus-within{box-shadow:0 0 0 2px #8FD3B2,0 30px 60px -34px rgba(32,37,34,.6)}
@keyframes rk-toast{0%{opacity:0;transform:translateY(6px)}15%,85%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-4px)}}
@keyframes sl-land{0%{transform:scale(.98) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes rk-fade{from{opacity:0}to{opacity:1}}
@keyframes rk-rise{from{opacity:0;transform:translateY(40px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes rk-drift{0%{background-position:0% 0%,100% 100%,0 0}50%{background-position:100% 40%,0% 60%,0 0}100%{background-position:0% 0%,100% 100%,0 0}}
.rk-hero-bg{background:radial-gradient(40% 55% at 50% 50%, rgba(40,122,89,.16), rgba(40,122,89,0) 70%),radial-gradient(35% 50% at 50% 50%, rgba(214,196,160,.45), rgba(214,196,160,0) 70%),#F5F3ED;background-size:160% 160%,140% 140%,100% 100%;background-repeat:no-repeat;animation:rk-drift 24s ease-in-out infinite}
.rk-btn{transition:transform 200ms ease, box-shadow 200ms ease, background-color 200ms ease, border-color 200ms ease, color 200ms ease}
.rk-btn:hover{transform:translateY(-2px)}
.rk-btn:active{transform:translateY(0) scale(.98)}
.rk-btn-dark:hover{background-color:#323935 !important;box-shadow:0 12px 24px -14px rgba(32,37,34,.7);color:#F5F3ED}
.rk-btn-line:hover{border-color:#287A59 !important;background-color:#FBFAF6;color:#202522;box-shadow:0 10px 22px -16px rgba(32,37,34,.5)}
.rk-btn-accent:hover{filter:brightness(1.08);box-shadow:0 12px 24px -14px rgba(40,122,89,.8)}
.rk-btn svg{transition:transform 200ms ease}
.rk-btn:hover svg{transform:translateX(3px)}
.rk-social{gap:8px;transition:color 200ms ease}
.rk-social span{padding-bottom:2px;background:linear-gradient(currentColor,currentColor) left bottom / 0 1.5px no-repeat;transition:background-size 300ms cubic-bezier(.2,.7,.2,1)}
.rk-social:hover{color:#8FD3B2 !important}
.rk-social:hover span{background-size:100% 1.5px}
.rk-social svg{transition:transform 260ms cubic-bezier(.2,.7,.2,1)}
.rk-social:hover svg{transform:translate(3px,-3px) rotate(-6deg)}
@keyframes rk-float{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes rk-pop{0%{opacity:0;scale:.6}100%{opacity:1;scale:1}}
@keyframes sl-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sl-shakeA{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes sl-shakeB{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
